<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Prospect Notebook | Hill Insights</title><style>
:root{--ink:#26343c;--muted:#64747a;--copper:#9a7250;--line:#d9e0df;--paper:#f5f5f1}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:15px/1.6 Arial,sans-serif;color:var(--ink)}header{background:white;border-bottom:1px solid var(--line);padding:22px max(24px,calc((100vw - 1160px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font:27px Georgia,serif}.brand small{display:block;font:10px Arial;letter-spacing:2.5px;color:var(--copper);margin-top:5px}main{max-width:1160px;margin:auto;padding:38px 24px 70px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--copper)}h1{font:42px/1.15 Georgia,serif;margin:12px 0}h2{font:25px Georgia,serif;margin:0 0 14px}h3{margin:0 0 6px;font-size:17px}p{color:var(--muted)}button,.button{border:1px solid var(--line);border-radius:5px;background:white;padding:10px 16px;color:var(--ink);font:inherit;cursor:pointer;text-decoration:none;display:inline-block}button:hover,.button:hover{border-color:var(--copper)}.primary{background:var(--ink);color:white;border-color:var(--ink)}.actions{display:flex;gap:9px;flex-wrap:wrap}.row{display:flex;align-items:center;justify-content:space-between;gap:20px}.intro{margin-bottom:30px}.note{background:#ece8df;border-left:3px solid var(--copper);padding:13px 17px;font-size:13px;margin:22px 0}.grid{display:grid;gap:20px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.card{background:white;border:1px solid var(--line);border-radius:8px;padding:24px}.card-link{color:inherit;text-decoration:none;display:block}.card-link:hover{border-color:var(--copper)}.small{font-size:12px;color:var(--muted)}label{display:block;font-size:13px;margin-bottom:6px;color:var(--muted)}input,select,textarea{width:100%;font:inherit;color:var(--ink);border:1px solid #c6d0cc;border-radius:5px;padding:10px;background:white}textarea{min-height:100px;resize:vertical}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--copper);outline-offset:3px}.field{margin-bottom:18px}.section{margin-top:26px}.pill{display:inline-block;background:#eef1ec;color:#466253;padding:3px 9px;font-size:11px;border-radius:20px}.priority{background:#f2e8dc;color:#7c5b38}.empty{text-align:center;padding:55px 20px}.empty p{max-width:470px;margin:15px auto 25px}.rule{border-bottom:1px solid var(--line);padding:15px 0}.pre{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;margin:25px 0}.facts{border-top:3px solid #456b5c}.hypotheses{border-top:3px solid var(--copper)}.hide{display:none!important}#toast{position:fixed;right:22px;bottom:22px;background:var(--ink);color:white;padding:12px 20px;border-radius:6px;max-width:90vw}footer{font-size:12px;color:var(--muted);margin-top:35px}dialog{border:1px solid var(--line);border-radius:9px;max-width:500px;padding:30px}dialog::backdrop{background:#26343c88}a{color:#765238}.count{font:29px Georgia,serif}.form-actions{position:sticky;bottom:0;background:#f5f5f1f5;padding:16px 0;border-top:1px solid var(--line)}@media(max-width:760px){header{padding:18px 22px;align-items:start;flex-direction:column}main{padding:25px 18px}.two,.three,.toolbar{grid-template-columns:1fr}h1{font-size:34px}.row{align-items:start;flex-direction:column}.card{padding:20px}}@media print{header button,header .actions,.actions,.note,.toolbar,footer,.form-actions{display:none!important}body{background:white}main{max-width:none;padding:10px}.card{break-inside:avoid}.two{grid-template-columns:1fr 1fr}h1{font-size:30px}}
</style></head><body><header><div class="brand">Hill Insights<small>PROSPECT NOTEBOOK</small></div><div class="actions"><button onclick="location.hash=''">Organizations</button><button onclick="backup()">Export backup</button><button onclick="document.getElementById('import').click()">Import backup</button><input class="hide" id="import" type="file" accept="application/json"></div></header><main id="app"></main><div id="toast" class="hide" role="status"></div><dialog id="confirm"><h2>Move this organization to the archive?</h2><p>You can restore the record from the Archived view.</p><div class="actions"><button id="archiveYes" class="primary">Archive organization</button><button onclick="document.getElementById('confirm').close()">Keep record</button></div></dialog><script>
const KEY='hill-prospect-notebook-v1',DRAFT='hill-prospect-draft-v1';let records=[],storageOK=true,query='',statusFilter='All',priorityFilter='All',archived=false,editing=false;const stages=['Researching','Worth a conversation','Contacted','Conversation scheduled','Exploring a need','Proposal','Client','Not pursuing'],priorities=['Unassigned','High','Medium','Low'];const fields={name:'Organization name',website:'Website',industry:'Industry / type',location:'Location / service area',size:'Approximate size',status:'Relationship stage',priority:'Your priority',reason:'Why this organization caught your attention',facts:'Observed facts',sources:'Sources and dates',needs:'Possible organizational needs',alternatives:'Other explanations / evidence against the need',fit:'Where Hill Insights could help',limits:'Reasons this may not fit',contact:'People and roles',route:'Connection or route to a conversation',next:'Next action',due:'Follow-up date',notes:'Conversation notes'};const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));try{records=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(records))throw Error()}catch{storageOK=false;records=[]}function persist(next){try{localStorage.setItem(KEY,JSON.stringify(next));records=next;return true}catch{storageOK=false;toast('Could not save. Export a backup before leaving.');return false}}function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hide');setTimeout(()=>$('#toast').classList.add('hide'),4000)}function date(s){if(!s)return 'No date';let d=new Date(s+'T12:00:00');return isNaN(d)?s:d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}function today(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function safeURL(s){try{let u=new URL(/^https?:\/\//i.test(s)?s:'https://'+s);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}}function footer(){return `<footer>Records save only in this browser on this device. Clearing site data or using a different browser will not preserve them. Export backups regularly. Company profiles are local views, not public pages or shareable links.</footer>`}function go(id){location.hash=id?'company/'+encodeURIComponent(id):''}function route(){editing=false;let h=location.hash.slice(1);if(h==='new')return form();if(h.startsWith('edit/'))return form(records.find(r=>r.id===decodeURIComponent(h.slice(5))));if(h.startsWith('company/')){let r=records.find(r=>r.id===decodeURIComponent(h.slice(8)));if(r)return profile(r);$('#app').innerHTML=`<div class="empty"><h1>Record not found in this browser.</h1><p>This address only opens a record stored on the device where it was created. Import your backup to open it here.</p><button onclick="go()">Back to organizations</button></div>`;return}list()}window.addEventListener('hashchange',route);window.addEventListener('beforeunload',e=>{if(editing){e.preventDefault();e.returnValue=''}});
function list(){let active=records.filter(r=>!r.archived),due=active.filter(r=>r.due&&r.due<=today());$('#app').innerHTML=`<div class="row intro"><div><div class="eyebrow">Your organizations. Your observations.</div><h1>Who deserves a closer look?</h1><p>Keep the facts, possible needs, and next conversation together.</p></div><button class="primary" onclick="location.hash='new'">+ Add organization</button></div><div class="grid three"><div class="card"><div class="small">ACTIVE ORGANIZATIONS</div><div class="count">${active.length}</div></div><div class="card"><div class="small">WORTH A CONVERSATION</div><div class="count">${active.filter(r=>r.status==='Worth a conversation').length}</div></div><div class="card"><div class="small">FOLLOW-UPS DUE</div><div class="count">${due.length}</div></div></div><div class="note">Start with an organization and what caught your attention. You can leave the rest blank and build the record as you learn. No scores or research claims are generated.</div>${!storageOK?'<div class="note">Browser storage unavailable. Saving may fail; export your work.</div>':''}<div class="row section"><h2>${archived?'Archived':'Organizations'}</h2><button onclick="archived=!archived;list()">${archived?'Show active':'Show archive'}</button></div><div class="toolbar"><div><label for="search">Search names, notes, needs, and contacts</label><input id="search" type="search" value="${esc(query)}" placeholder="Find an organization…" oninput="query=this.value;drawCards()"></div><div><label for="stage">Relationship stage</label><select id="stage" onchange="statusFilter=this.value;drawCards()">${['All',...stages].map(s=>`<option ${statusFilter===s?'selected':''}>${s}</option>`).join('')}</select></div><div><label for="priority">Priority</label><select id="priority" onchange="priorityFilter=this.value;drawCards()">${['All',...priorities].map(s=>`<option ${priorityFilter===s?'selected':''}>${s}</option>`).join('')}</select></div></div><div id="cards" class="grid three"></div>${footer()}`;drawCards()}
function drawCards(){let rows=records.filter(r=>!!r.archived===archived&&(statusFilter==='All'||r.status===statusFilter)&&(priorityFilter==='All'||r.priority===priorityFilter)&&Object.values(r).some(v=>String(v).toLowerCase().includes(query.toLowerCase()))).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||b.updated.localeCompare(a.updated));$('#cards').innerHTML=rows.map(r=>`<a class="card card-link" href="#company/${encodeURIComponent(r.id)}"><div class="row"><span class="pill">${esc(r.status)}</span>${r.priority==='High'?'<span class="pill priority">High priority</span>':''}</div><h3 style="margin-top:20px">${esc(r.name)}</h3><div class="small">${esc([r.industry,r.location].filter(Boolean).join(' · '))||'Details to add'}</div><p>${esc((r.reason||r.needs||'No observations added yet.').slice(0,180))}</p><div class="rule small">Next: ${esc(r.next||'Not defined')}</div><div class="small" style="margin-top:10px">${r.due?'Follow up '+date(r.due):'No follow-up date'}${r.due&&r.due<=today()?' · Due':''}</div></a>`).join('')||`<div class="card empty" style="grid-column:1/-1"><div class="eyebrow">${records.length?'No matching records':'A blank notebook'}</div><h2>${records.length?'Nothing matches these filters.':'Begin with one organization.'}</h2><p>${records.length?'Change the search, stage, priority, or archive view.':'Add its name and one observation. Saving creates a company profile you can reopen and develop over time.'}</p>${!records.length?'<button class="primary" onclick="location.hash=\'new\'">Add your first organization</button>':''}</div>`}
function input(k,r,type='text'){return `<div class="field"><label for="f-${k}">${fields[k]}${k==='name'?' *':''}</label>${type==='textarea'?`<textarea id="f-${k}" name="${k}">${esc(r[k])}</textarea>`:type==='select'?`<select id="f-${k}" name="${k}">${(k==='status'?stages:priorities).map(s=>`<option ${r[k]===s?'selected':''}>${s}</option>`).join('')}</select>`:`<input id="f-${k}" name="${k}" type="${type}" value="${esc(r[k])}" ${k==='name'?'required maxlength="180"':''}>`}</div>`}
function form(r){if(location.hash.startsWith('#edit/')&&!r){go();return}let fresh=!r;r=r||{status:'Researching',priority:'Unassigned'};let draft=null;try{draft=JSON.parse(localStorage.getItem(DRAFT)||'null')}catch{}$('#app').innerHTML=`<div class="eyebrow">${fresh?'New organization':'Edit organization'}</div><h1>${fresh?'Start a company profile.':esc(r.name)}</h1><p>Only the organization name is required. Save what you know; revisit what you don’t.</p>${fresh&&draft?'<div class="note">An unfinished new record was found. <button type="button" onclick="restoreDraft()">Restore draft</button></div>':''}<form id="companyForm"><div class="card"><h2>Organization</h2><div class="grid two">${input('name',r)}${input('website',r)}${input('industry',r)}${input('location',r)}${input('size',r)}${input('status',r,'select')}${input('priority',r,'select')}</div>${input('reason',r,'textarea')}</div><div class="grid two section"><div class="card facts"><h2>What you know</h2><p class="small">Record what you observed, heard, or read. Include dates and where it came from.</p>${input('facts',r,'textarea')}${input('sources',r,'textarea')}</div><div class="card hypotheses"><h2>What you suspect</h2><p class="small">A possible need remains a hypothesis until conversations and evidence support it.</p>${input('needs',r,'textarea')}${input('alternatives',r,'textarea')}</div></div><div class="card section"><h2>Fit for Hill Insights</h2><div class="grid two">${input('fit',r,'textarea')}${input('limits',r,'textarea')}</div><p class="small">Consider process consultation, organizational alignment, systems integration, and cross-functional collaboration. Record scope or delivery constraints that matter to you.</p></div><div class="card section"><h2>People & next steps</h2><div class="grid two">${input('contact',r,'textarea')}${input('route',r,'textarea')}${input('next',r)}${input('due',r,'date')}</div>${input('notes',r,'textarea')}</div><div class="form-actions actions"><button class="primary">${fresh?'Save & create profile':'Save changes'}</button><button type="button" onclick="cancelEdit('${esc(r.id||'')}')">Cancel</button><span class="small" id="draftStatus">${fresh?'New-entry drafts save in this browser as you type.':'Save changes before leaving this form.'}</span></div></form>${footer()}`;let f=$('#companyForm');f.oninput=()=>{editing=true;if(fresh)try{localStorage.setItem(DRAFT,JSON.stringify(Object.fromEntries(new FormData(f))));$('#draftStatus').textContent='Draft saved in this browser'}catch{$('#draftStatus').textContent='Draft could not be saved'}};f.onsubmit=e=>{e.preventDefault();let values=Object.fromEntries(new FormData(f));values.name=values.name.trim();if(!values.name)return toast('Enter an organization name');if(values.website&&!safeURL(values.website))return toast('Enter a valid website address');let rec={...r,...values,id:r.id||crypto.randomUUID(),created:r.created||new Date().toISOString(),updated:new Date().toISOString(),archived:!!r.archived};let next=records.filter(x=>x.id!==rec.id).concat(rec);if(!persist(next))return;editing=false;if(fresh)try{localStorage.removeItem(DRAFT)}catch{}go(rec.id);toast('Company profile saved')};}
function cancelEdit(id){if(editing&&!confirm('Leave this form without saving changes? A new-entry draft, if available, stays in this browser.'))return;editing=false;go(id)}function restoreDraft(){try{let d=JSON.parse(localStorage.getItem(DRAFT)||'{}');for(let [k,v]of Object.entries(d)){let el=$('#companyForm').elements.namedItem(k);if(el)el.value=v}editing=true;toast('Draft restored')}catch{toast('Draft could not be restored')}}function content(r){let website=safeURL(r.website);return `<div class="eyebrow">Company profile · Hill Insights</div><h1>${esc(r.name)}</h1><div class="actions"><span class="pill">${esc(r.status)}</span><span class="pill priority">${esc(r.priority)} priority</span>${r.archived?'<span class="pill">Archived</span>':''}</div><p>${esc([r.industry,r.location,r.size].filter(Boolean).join(' · '))||'Organization details not yet added'}${website?`<br><a href="${esc(website)}" target="_blank" rel="noopener">${esc(r.website)}</a>`:''}</p><div class="card section"><h2>Why this organization?</h2><div class="pre">${esc(r.reason)||'<span class="small">Add what caught your attention.</span>'}</div></div><div class="grid two section"><div class="card facts"><h2>Observed facts</h2><div class="pre">${esc(r.facts)||'<span class="small">No facts recorded.</span>'}</div><h3 class="section">Sources and dates</h3><div class="pre">${esc(r.sources)||'<span class="small">No sources recorded.</span>'}</div></div><div class="card hypotheses"><h2>Possible needs</h2><div class="pre">${esc(r.needs)||'<span class="small">No hypothesis recorded.</span>'}</div><h3 class="section">Other explanations</h3><div class="pre">${esc(r.alternatives)||'<span class="small">Not yet explored.</span>'}</div></div></div><div class="grid two section"><div class="card"><h2>Potential contribution</h2><div class="pre">${esc(r.fit)||'<span class="small">Not yet assessed.</span>'}</div><h3 class="section">Limits / reasons to pass</h3><div class="pre">${esc(r.limits)||'<span class="small">Not yet assessed.</span>'}</div></div><div class="card"><h2>Next action</h2><div class="pre">${esc(r.next)||'<span class="small">No next action defined.</span>'}</div><p>Follow up: ${date(r.due)}</p><h3>People and roles</h3><div class="pre">${esc(r.contact)||'<span class="small">No contacts recorded.</span>'}</div><h3 class="section">Route to a conversation</h3><div class="pre">${esc(r.route)||'<span class="small">Not recorded.</span>'}</div></div></div><div class="card section"><h2>Conversation notes</h2><div class="pre">${esc(r.notes)||'<span class="small">No notes yet.</span>'}</div></div><p class="small">Created ${date(r.created.slice(0,10))} · Updated ${date(r.updated.slice(0,10))}</p>`}
function profile(r){$('#app').innerHTML=`<div class="actions intro"><button onclick="go()">← Organizations</button><button class="primary" onclick="location.hash='edit/${r.id}'">Edit profile</button><button onclick="downloadPage('${r.id}')">Download company page</button><button onclick="window.print()">Print / save PDF</button><button onclick="archiveRecord('${r.id}')">${r.archived?'Restore from archive':'Archive'}</button></div>${content(r)}<div class="note">This profile lives in this browser. Its address identifies your local record; sending that address to someone will not share the record. Download the company page to create a portable HTML snapshot.</div>${footer()}`}
function archiveRecord(id){let r=records.find(x=>x.id===id);if(r.archived){if(persist(records.map(x=>x.id===id?{...x,archived:false}:x)))profile(records.find(x=>x.id===id));return}$('#confirm').showModal();$('#archiveYes').onclick=()=>{if(persist(records.map(x=>x.id===id?{...x,archived:true}:x))){$('#confirm').close();profile(records.find(x=>x.id===id))}}}function download(name,data,type){let url=URL.createObjectURL(new Blob([data],{type}));let a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function backup(){download('hill-insights-prospects-'+today()+'.json',JSON.stringify({version:1,exported:new Date().toISOString(),records},null,2),'application/json');toast('Backup download requested')}function downloadPage(id){let r=records.find(x=>x.id===id);let css=document.querySelector('style').textContent;download((r.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,80)||'organization')+'.html','<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(r.name)+' | Hill Insights</title><style>'+css+'</style><main>'+content(r)+'<footer>Company profile snapshot · Exported '+date(today())+' · This file contains notes as entered by its author.</footer></main></html>','text/html')}
function validateBackup(d){if(d.version!==1||!Array.isArray(d.records))throw Error('Not a Prospect Notebook backup');let ids=new Set();for(let r of d.records){if(typeof r.id!=='string'||!/^[a-zA-Z0-9-]{1,100}$/.test(r.id)||ids.has(r.id)||typeof r.name!=='string'||!r.name.trim())throw Error('Invalid or duplicate company record');ids.add(r.id);for(let k of Object.keys(fields))if(r[k]!==undefined&&typeof r[k]!=='string')throw Error('Invalid field '+k);if(!stages.includes(r.status)||!priorities.includes(r.priority)||typeof r.created!=='string'||typeof r.updated!=='string'||isNaN(Date.parse(r.created))||isNaN(Date.parse(r.updated)))throw Error('Invalid record metadata');if(r.website&&!safeURL(r.website))throw Error('Invalid website');}return d.records}
$('#import').onchange=async e=>{try{let incoming=validateBackup(JSON.parse(await e.target.files[0].text()));let merged=[...records],added=0,skipped=0;for(let r of incoming){if(merged.some(x=>x.id===r.id)){skipped++;continue}merged.push(r);added++}if(persist(merged)){location.hash='';list();toast(`${added} organizations imported; ${skipped} existing records kept.`)}}catch(err){toast('Import failed: '+err.message)}e.target.value=''};route();
</script></body></html>
